name: Deploy Aditya Birla

on:
  push:
    branches:
      - aditya-birla

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Aditya Birla to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy-aditya-birla.sh