name: Deploy Aditya Birla HIM
run-name: Deploy Aditya Birla HIM

on:
  push:
    branches:
      - aditya-birla

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Aditya Birla HIM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            /srv/deploy/deploy-aditya-birla.sh