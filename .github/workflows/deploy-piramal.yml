name: Deploy Piramal

on:
  push:
    branches:
      - piramal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Piramal to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy-piramal.sh