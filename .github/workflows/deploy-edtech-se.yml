name: Deploy EdTech SE

on:
  push:
    branches:
      - edtech-se

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy EdTech SE to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy-edtech-se.sh