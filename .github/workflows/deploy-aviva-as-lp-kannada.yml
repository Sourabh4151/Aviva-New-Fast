
name: Deploy Aviva AS Kannada

on:
  push:
    branches:
      - aviva-as-lp-kannada

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on microsites server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            /srv/deploy/deploy-aviva-as-lp-kannada.sh
