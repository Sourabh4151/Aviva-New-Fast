name: Deploy Hero COM

on:
  push:
    branches:
      - hero-com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Hero COM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy-hero-com.sh