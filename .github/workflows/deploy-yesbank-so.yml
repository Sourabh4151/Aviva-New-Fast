name: Deploy Yes Bank SO

on:
  push:
    branches:
      - yesbank-so

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Yes Bank SO
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy-yesbank-so.sh