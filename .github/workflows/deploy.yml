name: Deploy Elevate Axis VRM

on:
  push:
    branches:
      - elevate-axis-vrm

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Elevate Axis VRM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy-elevate-axis-vrm.sh