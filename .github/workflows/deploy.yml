name: Deploy Axis RO

on:
  push:
    branches:
      - axis-ro

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Axis RO
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy-axis-ro.sh