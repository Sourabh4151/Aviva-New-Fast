name: Deploy Aviva DS

on:
  push:
    branches:
      - Aviva-DS

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Aviva DS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy.sh Aviva-DS