name: Deploy Rupyy BM

on:
  push:
    branches:
      - rupyy-bm

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Rupyy BM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy-rupyy-bm.sh