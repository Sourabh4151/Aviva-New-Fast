name: Deploy Mahindra

on:
  push:
    branches:
      - mahindra

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Mahindra
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy-mahindra.sh