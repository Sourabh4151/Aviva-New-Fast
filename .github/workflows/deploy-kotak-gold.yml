name: Deploy Kotak Gold

on:
  push:
    branches:
      - kotak-gold

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Kotak Gold to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /srv/deploy/deploy-kotak-gold.sh