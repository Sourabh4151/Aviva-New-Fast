name: Deploy Yes Bank OSD
run-name: Deploy Yes Bank OSD

on:
  push:
    branches:
      - yesbank-osd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Yes Bank OSD
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            /srv/deploy/deploy-yesbank-osd.sh